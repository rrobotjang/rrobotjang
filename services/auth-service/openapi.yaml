openapi: 3.0.3
info:
  title: Auth Service Contract
  version: 1.0.0
paths:
  /api/auth/login:
    post:
      summary: Issue JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
      responses:
        '200':
          description: JWT token response
  /api/auth/validate:
    get:
      summary: Validate JWT token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token valid
        '401':
          description: Unauthorized
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
